<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Public Project - FluentBuddy</title>
  <style>
    :root {
      --bg: #f5f7ff;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #4f46e5;
      --primary-soft: rgba(79, 70, 229, 0.12);
      --border: #e5e7eb;
      --success: #10b981;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page-shell {
      max-width: 980px;
      margin: 40px auto;
      padding: 0 20px 40px;
    }
    .hero {
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 8px 20px rgba(79, 70, 229, 0.08);
    }
    .eyebrow {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 3vw, 2.8rem);
    }
    .intro {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
      max-width: 760px;
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 18px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 5px 12px rgba(15, 23, 42, 0.04);
    }
    .stat-label {
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
      display: block;
    }
    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      margin: 0;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 24px;
    }
    .panel h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.4rem;
    }
    .note-list, .file-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: grid;
      gap: 16px;
    }
    .note-item, .file-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      background: #fafafa;
    }
    .note-item h3, .file-item h3 {
      margin: 0 0 10px;
      font-size: 1.1rem;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 10px;
    }
    .note-content {
      color: #374151;
      line-height: 1.7;
      white-space: pre-wrap;
      margin: 0;
    }
    .file-item a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .empty-state {
      color: var(--muted);
      padding: 18px;
      border: 1px dashed var(--border);
      border-radius: 12px;
      background: #fafafa;
    }
    .member-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .member-pill {
      background: var(--primary-soft);
      color: var(--primary);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <div class="eyebrow">Public project</div>
      <h1 id="projectName">Loading project…</h1>
      <p id="projectDescription" class="intro">Fetching public project details…</p>
    </section>

    <section class="summary-grid">
      <div class="stat-card">
        <span class="stat-label">Members</span>
        <p id="memberCount" class="stat-value">0</p>
      </div>
      <div class="stat-card">
        <span class="stat-label">Notes</span>
        <p id="noteCount" class="stat-value">0</p>
      </div>
      <div class="stat-card">
        <span class="stat-label">Files</span>
        <p id="fileCount" class="stat-value">0</p>
      </div>
    </section>

    <section class="panel">
      <h2>Team members</h2>
      <div id="memberList" class="member-list"></div>
    </section>

    <section class="panel">
      <h2>Notes</h2>
      <ul id="noteList" class="note-list"></ul>
    </section>

    <section class="panel">
      <h2>Files</h2>
      <ul id="fileList" class="file-list"></ul>
    </section>
  </main>

  <link rel="stylesheet" href="css/chat-widget.css">
  <script src="js/layout.js"></script>
  <script src="js/ChatWidget.js"></script>
  <script src="js/project-public.js"></script>
</body>
</html>
